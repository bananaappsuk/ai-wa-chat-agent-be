# Render Blueprint — separate API, worker, and scheduler services.
# Do NOT combine API + worker in one process.
services:
  - type: web
    name: ai-wa-chat-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SERVICE_NAME
        value: ai-wa-chat-agent-api
      - key: RUN_INLINE_SCHEDULER
        value: "false"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: TWILIO_VALIDATE_SIGNATURE
        value: "true"
      - key: OPENAI_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: METRICS_TOKEN
        sync: false

  - type: worker
    name: ai-wa-chat-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh start-worker.sh
    plan: starter
    envVars:
      - fromService:
          type: web
          name: ai-wa-chat-api
          envVarKey: APP_ENV
      - key: SERVICE_NAME
        value: ai-wa-chat-agent-worker
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: worker
    name: ai-wa-chat-scheduler
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: sh start-scheduler.sh
    plan: starter
    # Keep a single scheduler instance (do not scale replicas).
    envVars:
      - key: APP_ENV
        value: production
      - key: SERVICE_NAME
        value: ai-wa-chat-agent-scheduler
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: SENTRY_DSN
        sync: false
